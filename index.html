<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Sage — 面向普通用户的极简 AI 投研工具。输入一个问题，获得有数据支撑的分析。"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph: 微信 / 即刻 / 小红书 链接预览卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sage — 极简 AI 投研工具" />
    <meta
      property="og:description"
      content="输入一个问题，获得有数据支撑的分析。面向普通用户的极简 AI 投研工具。"
    />
    <meta property="og:image" content="https://app.nakocai.com/logo.png" />
    <meta property="og:url" content="https://app.nakocai.com" />
    <meta property="og:site_name" content="Sage" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sage — 极简 AI 投研工具" />
    <meta
      name="twitter:description"
      content="输入一个问题，获得有数据支撑的分析。"
    />
    <meta name="twitter:image" content="https://app.nakocai.com/logo.png" />
    <title>Sage — 极简 AI 投研工具</title>
    <script>
      (function () {
        try {
          var settings = JSON.parse(
            localStorage.getItem('sage_settings') || '{}'
          );
          var theme = settings.theme || 'system';
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          if (settings.backgroundStyle === 'warm') {
            document.documentElement.classList.add('bg-warm');
          } else if (settings.backgroundStyle === 'cool') {
            document.documentElement.classList.add('bg-cool');
          }
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div
        style="
          min-height: 100svh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family:
            system-ui,
            -apple-system,
            'PingFang SC',
            sans-serif;
        "
      >
        <div
          style="
            width: 24px;
            height: 24px;
            border: 2px solid #f97316;
            border-top-color: transparent;
            border-radius: 9999px;
            animation: sage-boot-spin 0.8s linear infinite;
          "
        ></div>
      </div>
      <style>
        @keyframes sage-boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
