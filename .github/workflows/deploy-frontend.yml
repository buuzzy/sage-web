name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy/dist
          cp -r dist/* deploy/dist/
          printf 'FROM node:22-alpine\nRUN npm install -g serve\nWORKDIR /app\nCOPY dist ./dist\nEXPOSE 1420\nCMD ["serve", "-s", "dist", "-l", "1420"]\n' > deploy/Dockerfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd deploy
          railway up --service f132689f-5154-4cfd-b068-4e5bb144be05 --project d5dd1df3-18e9-48e3-9cdb-a6334927cc6e --environment 128203a4-0ad7-4b28-b900-fed680862b14 --detach
